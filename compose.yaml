services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: forgepods_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: forgepods
      RABBITMQ_DEFAULT_PASS: forgepods_dev
    volumes:
      - forgepods_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  forgepods_rabbitmq_data:
