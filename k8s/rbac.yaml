apiVersion: v1
kind: Namespace
metadata:
  name: forgepods
  labels:
    app.kubernetes.io/part-of: forgepods
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgepods-orchestrator
  namespace: forgepods
  labels:
    app.kubernetes.io/name: forgepods-orchestrator
    app.kubernetes.io/part-of: forgepods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgepods-orchestrator
  namespace: forgepods
  labels:
    app.kubernetes.io/name: forgepods-orchestrator
    app.kubernetes.io/part-of: forgepods
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgepods-orchestrator
  namespace: forgepods
  labels:
    app.kubernetes.io/name: forgepods-orchestrator
    app.kubernetes.io/part-of: forgepods
subjects:
  - kind: ServiceAccount
    name: forgepods-orchestrator
    namespace: forgepods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgepods-orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgepods-workspace
  namespace: forgepods
  labels:
    app.kubernetes.io/name: forgepods-workspace
    app.kubernetes.io/part-of: forgepods
